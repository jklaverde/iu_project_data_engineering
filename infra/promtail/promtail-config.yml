# Tails every compose container's stdout via Docker service discovery - no
# per-service logging change needed, since every service already emits
# JSON-line logs (see e.g. backend/app/logging_setup.py, producer/producer/
# logging_setup.py, spark_job/spark_job/logging_setup.py - identical pattern).
# Only "container" and "level" become indexed labels (bounded cardinality);
# everything else stays queryable in the log body via LogQL `| json`, per
# Loki's own high-cardinality-label guidance.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
