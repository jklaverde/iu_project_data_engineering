apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Cassandra
    uid: cassandra
    type: hadesarchitect-cassandra-datasource
    access: proxy
    url: cassandra:9042
    jsonData:
      keyspace: iot
      consistency: ONE
      user: cassandra
    secureJsonData:
      # AllowAllAuthenticator is in effect (no CASSANDRA_AUTHENTICATOR set in
      # docker-compose.yml) - these credentials are never actually checked,
      # but the plugin's config schema requires the fields to be present.
      password: cassandra
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
