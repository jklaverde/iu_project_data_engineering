name: iu-sensor-pipeline

services:
  kafka-volume-init:
    image: apache/kafka:3.7.0
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /var/lib/kafka/kafka_data && chown -R 1000:1000 /var/lib/kafka/kafka_data"
    volumes:
      - kafka_data:/var/lib/kafka/kafka_data
    restart: "no"
    mem_limit: 128m

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_LOG_DIRS: /var/lib/kafka/kafka_data
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/kafka_data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    mem_limit: 1500m

  kafka-topic-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TOPIC_NAME: ${KAFKA_TOPIC_NAME:-sensor-readings}
      TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server $$KAFKA_BOOTSTRAP --create --if-not-exists --topic $$TOPIC_NAME --partitions $$TOPIC_PARTITIONS --replication-factor $$TOPIC_REPLICATION_FACTOR && /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$KAFKA_BOOTSTRAP --describe --topic $$TOPIC_NAME"
    restart: "no"
    mem_limit: 256m

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME:-sensor-readings}
      PRODUCER_RATE_MSGS_PER_SEC: ${PRODUCER_RATE_MSGS_PER_SEC:-100}
      PRODUCER_ANOMALY_PROBABILITY: ${PRODUCER_ANOMALY_PROBABILITY:-0.05}
      PRODUCER_ANOMALY_SIGMA_MULTIPLIER: ${PRODUCER_ANOMALY_SIGMA_MULTIPLIER:-4.0}
      PRODUCER_DATASET_CSV_PATH: ${PRODUCER_DATASET_CSV_PATH:-/data/iot_telemetry_data.csv}
      PRODUCER_REPLAY_ROW_LIMIT: ${PRODUCER_REPLAY_ROW_LIMIT:-0}
      PRODUCER_STATE_HTTP_PORT: 8000
      PRODUCER_LOG_LEVEL: ${PRODUCER_LOG_LEVEL:-INFO}
    volumes:
      - ./kaggle_repository:/data:ro
    ports:
      - "${PRODUCER_STATE_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/healthz',timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 384m

  cassandra:
    build:
      context: ./infra/cassandra
      dockerfile: Dockerfile
    environment:
      CASSANDRA_CLUSTER_NAME: iot-cluster-dev
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      JVM_EXTRA_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=7070:/opt/jmx-exporter/cassandra-jmx-exporter.yml"
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
      - "${CASSANDRA_JMX_EXPORTER_PORT:-7070}:7070"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 2g

  cassandra-schema-init:
    image: cassandra:4.1.12
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./infra/cassandra/schema:/schema:ro
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "for i in $(seq 1 30); do cqlsh $$CASSANDRA_HOST $$CASSANDRA_PORT -f /schema/001_keyspace.cql && break; echo 'cassandra not ready yet, retrying...'; sleep 5; done && cqlsh $$CASSANDRA_HOST $$CASSANDRA_PORT -f /schema/002_raw_events.cql && cqlsh $$CASSANDRA_HOST $$CASSANDRA_PORT -f /schema/003_agg_1m.cql && cqlsh $$CASSANDRA_HOST $$CASSANDRA_PORT -f /schema/004_agg_1h.cql"
    restart: "no"
    mem_limit: 256m

  spark-master:
    image: apache/spark:3.5.9
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g

  spark-worker:
    build:
      context: ./spark_job
      dockerfile: worker.Dockerfile
    depends_on:
      spark-master:
        condition: service_healthy
      spark-job-volume-init:
        condition: service_completed_successfully
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      # executors run here, not in the spark-job driver container - any local
      # file path a Spark job reads (e.g. the CSV baseline seed) must be
      # mounted identically on every node that runs tasks, not just the driver.
      # Same reasoning for spark_checkpoints: Structured Streaming state-store
      # data (for stateful ops like applyInPandasWithState and windowed
      # aggregations) is written by executors, not the driver.
      - ./kaggle_repository:/data:ro
      - spark_checkpoints:/opt/spark-checkpoints
    ports:
      - "${SPARK_WORKER_UI_PORT:-8091}:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1500m

  spark-job-volume-init:
    image: apache/spark:3.5.9
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /opt/spark-checkpoints && chown -R 185:185 /opt/spark-checkpoints"
    volumes:
      - spark_checkpoints:/opt/spark-checkpoints
    restart: "no"
    mem_limit: 128m

  spark-job:
    build:
      context: ./spark_job
      dockerfile: Dockerfile
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      cassandra-schema-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-job-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME:-sensor-readings}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: iot
      SPARK_JOB_TRIGGER_INTERVAL: ${SPARK_JOB_TRIGGER_INTERVAL:-30 seconds}
      SPARK_JOB_WATERMARK_1M: ${SPARK_JOB_WATERMARK_1M:-2 minutes}
      SPARK_JOB_WATERMARK_1H: ${SPARK_JOB_WATERMARK_1H:-10 minutes}
      SPARK_JOB_AGG_1H_WINDOW_DURATION: ${SPARK_JOB_AGG_1H_WINDOW_DURATION:-1 hour}
      SPARK_JOB_ANOMALY_SIGMA_N: ${SPARK_JOB_ANOMALY_SIGMA_N:-3.0}
      SPARK_JOB_ANOMALY_EWMA_ALPHA: ${SPARK_JOB_ANOMALY_EWMA_ALPHA:-0.001}
      SPARK_JOB_ANOMALY_CEILING_SAFETY_MULTIPLIER: ${SPARK_JOB_ANOMALY_CEILING_SAFETY_MULTIPLIER:-1.5}
      SPARK_JOB_BASELINE_CSV_PATH: ${SPARK_JOB_BASELINE_CSV_PATH:-/data/iot_telemetry_data.csv}
      SPARK_JOB_CHECKPOINT_ROOT: /opt/spark-checkpoints
      SPARK_JOB_STATE_HTTP_PORT: 8000
      SPARK_JOB_LOG_LEVEL: ${SPARK_JOB_LOG_LEVEL:-INFO}
    volumes:
      - ./kaggle_repository:/data:ro
      - spark_checkpoints:/opt/spark-checkpoints
    ports:
      - "${SPARK_JOB_STATE_PORT:-8002}:8000"
      - "${SPARK_JOB_DRIVER_UI_PORT:-4040}:4040"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/healthz',timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1500m
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - "--kafka.server=kafka:19092"
      - "--web.listen-address=:9308"
      - "--topic.filter=^${KAFKA_TOPIC_NAME:-sensor-readings}$$"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9308/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  grafana:
    build:
      context: ./infra/grafana
      dockerfile: Dockerfile
      args:
        CASSANDRA_PLUGIN_VERSION: ${GRAFANA_CASSANDRA_PLUGIN_VERSION:-3.3.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      cassandra-schema-init:
        condition: service_completed_successfully
      producer:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME:-sensor-readings}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: iot
      PRODUCER_STATE_URL: http://producer:8000
      SPARK_JOB_STATE_URL: http://spark-job:8000
      BACKEND_KNOWN_DEVICE_IDS: ${BACKEND_KNOWN_DEVICE_IDS:-b8:27:eb:bf:9d:51,00:0f:00:70:91:0a,1c:bf:ce:15:ec:4d}
      BACKEND_POLL_INTERVAL_SECONDS: ${BACKEND_POLL_INTERVAL_SECONDS:-2}
      BACKEND_HEALTH_CHECK_INTERVAL_SECONDS: ${BACKEND_HEALTH_CHECK_INTERVAL_SECONDS:-5}
      BACKEND_ADMIN_USERNAME: ${BACKEND_ADMIN_USERNAME:-admin}
      BACKEND_ADMIN_PASSWORD: ${BACKEND_ADMIN_PASSWORD:?Set BACKEND_ADMIN_PASSWORD in .env before starting}
      BACKEND_SESSION_SECRET: ${BACKEND_SESSION_SECRET:?Set BACKEND_SESSION_SECRET in .env before starting (e.g. openssl rand -hex 32)}
      BACKEND_SESSION_TTL_SECONDS: ${BACKEND_SESSION_TTL_SECONDS:-43200}
      BACKEND_COOKIE_SECURE: ${BACKEND_COOKIE_SECURE:-false}
      BACKEND_GRAFANA_PORT: ${GRAFANA_PORT:-3000}
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/healthz',timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 384m

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

volumes:
  kafka_data:
  cassandra_data:
  prometheus_data:
  grafana_data:
  spark_checkpoints:
