apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: iot-pipeline
spec:
  backoffLimit: 5
  template:
    spec:
      # See deployment-spark-master.yaml for why this is set cluster-wide.
      enableServiceLinks: false
      restartPolicy: OnFailure
      # Kubernetes Jobs don't block downstream pod scheduling the way
      # Compose's `depends_on: condition: service_completed_successfully`
      # does - this initContainer is the equivalent wait, checking the
      # kafka Service accepts TCP connections before the real command runs
      # (busybox ships `nc`, no extra image/RBAC needed).
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["/bin/sh", "-c", "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: kafka-topic-init
          image: apache/kafka:3.7.0
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka:19092
            - name: TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_TOPIC_NAME
            - name: TOPIC_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_TOPIC_PARTITIONS
            - name: TOPIC_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_TOPIC_REPLICATION_FACTOR
          command: ["/bin/bash", "-c"]
          args:
            - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server $KAFKA_BOOTSTRAP --create --if-not-exists --topic $TOPIC_NAME --partitions $TOPIC_PARTITIONS --replication-factor $TOPIC_REPLICATION_FACTOR && /opt/kafka/bin/kafka-topics.sh --bootstrap-server $KAFKA_BOOTSTRAP --describe --topic $TOPIC_NAME"
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 256Mi
