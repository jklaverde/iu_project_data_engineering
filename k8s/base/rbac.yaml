# D43 (NFR-16): replaces the Docker-socket mount (D42, NFR-15/R-9 - superseded)
# with a namespaced Role scoped to exactly what the backend's Cassandra
# node-deploy control (UC-12) and Kubernetes status panel (UC-13) need -
# nothing cluster-wide, and the write action (scaling) is pinned to the one
# StatefulSet by name via `resourceNames`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: iot-pipeline

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend
  namespace: iot-pipeline
rules:
  # FR-N1/N3/FR-K1: read pod/workload status to report storage, node health,
  # and the Kubernetes status panel.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # cassandra_nodes.py's _wait_pod_ready_sync polls read_namespaced_pod_status
  # during node-deploy (FR-N2) - a genuinely separate RBAC resource from
  # "pods" above, not covered by the rule above (D44, live-verified: the
  # underlying scale + Cassandra bootstrap/ring-join succeeded regardless,
  # but deploy_node()'s own readiness poll 403'd on every attempt, so the
  # admin-facing feature itself reported failure over the WebSocket).
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  # FR-N2: scale the cassandra StatefulSet only - not any other workload.
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["cassandra"]
    verbs: ["get", "patch"]
  # nodetool exec against the cassandra pods for storage/ring queries
  # (cassandra_nodes.py's _exec_sync) - pods/exec has no resourceNames
  # support, so this is scoped as tightly as RBAC allows (namespace + verb).
  # "create" is the documented verb for this subresource, but a real k3s
  # v1.36.4 control plane (D44) authorizes the python client's
  # connect_get_namespaced_pod_exec() call against "get" instead - both are
  # granted so this doesn't depend on which convention a given API server
  # version actually enforces.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend
  namespace: iot-pipeline
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: iot-pipeline
roleRef:
  kind: Role
  name: backend
  apiGroup: rbac.authorization.k8s.io
