kind: PersistentVolumeClaim
metadata:
  name: spark-checkpoints
  namespace: iot-pipeline
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

