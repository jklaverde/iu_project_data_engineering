apiVersion: v1
kind: Service
metadata:
  name: spark-job
  namespace: iot-pipeline
  labels:
    app: spark-job
spec:
  selector:
    app: spark-job
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: driver-ui
      port: 4040
      targetPort: 4040

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-job
  namespace: iot-pipeline
spec:
  replicas: 1
  # Found live (D43): the default RollingUpdate strategy briefly runs old and
  # new pods together, so during a rollout two Structured Streaming driver
  # apps register with spark-master at once - both requesting an executor on
  # the single spark-worker, whose memory limit only fits one at a time
  # (k8s/base/deployment-spark-worker.yaml). The second app's executor got
  # OOM-killed and relaunched in a loop, indefinitely blocking the new pod's
  # readiness (and therefore the old pod's removal) until manually resolved.
  # Recreate avoids the overlap entirely: old pod is fully gone before new
  # is created, at the cost of a short streaming-processing gap per deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-job
  template:
    metadata:
      labels:
        app: spark-job
    spec:
      # See deployment-spark-master.yaml for why this is set cluster-wide.
      enableServiceLinks: false
      # spark user, same as deployment-spark-worker.yaml - this pod (the
      # Structured Streaming driver) shares the spark_checkpoints PVC with
      # spark-worker's executors, so both need the same fsGroup.
      securityContext:
        fsGroup: 185
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - "/bin/sh"
            - "-c"
            - |
              until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done
              until nc -z cassandra 9042; do echo waiting for cassandra; sleep 2; done
              until nc -z spark-master 7077; do echo waiting for spark-master; sleep 2; done
      containers:
        - name: spark-job
          image: iu-sensor-pipeline/spark-job:local
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # Found live (D43): without this, Spark advertises this pod's
            # bare hostname as spark.driver.host. Docker Compose containers
            # are always self-resolvable by hostname on the user-defined
            # network, but a plain Kubernetes Deployment pod has no DNS
            # record for its own hostname - so the executor (running inside
            # spark-worker) got UnknownHostException trying to dial back to
            # register, and the driver sat forever logging "Initial job has
            # not accepted any resources". SPARK_LOCAL_IP makes Spark
            # advertise this literal, always-routable pod IP instead.
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:19092
            - name: KAFKA_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_TOPIC_NAME
            - name: CASSANDRA_HOST
              value: cassandra
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_KEYSPACE
              value: iot
            - name: SPARK_JOB_BASELINE_CSV_PATH
              value: /data/iot_telemetry_data.csv
            - name: SPARK_JOB_CHECKPOINT_ROOT
              value: /opt/spark-checkpoints
            - name: SPARK_JOB_STATE_HTTP_PORT
              value: "8000"
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 4040
              name: driver-ui
          volumeMounts:
            - name: kaggle-dataset
              mountPath: /data
              readOnly: true
            - name: spark-checkpoints
              mountPath: /opt/spark-checkpoints
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 2000Mi
      volumes:
        - name: kaggle-dataset
          persistentVolumeClaim:
            claimName: kaggle-dataset
        - name: spark-checkpoints
          persistentVolumeClaim:
            claimName: spark-checkpoints
