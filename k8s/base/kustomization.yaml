apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot-pipeline

resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - statefulset-cassandra.yaml
  - statefulset-kafka.yaml
  - job-dataset-init.yaml
  - job-kafka-topic-init.yaml
  - job-cassandra-schema-init.yaml
  - deployment-producer.yaml
  - deployment-spark-master.yaml
  - deployment-spark-worker.yaml
  - deployment-spark-job.yaml
  - deployment-backend.yaml
  - deployment-kafka-exporter.yaml
  - deployment-prometheus.yaml
  - deployment-loki.yaml
  - deployment-grafana.yaml
  - deployment-kafka-ui.yaml
  - daemonset-node-exporter.yaml
  - daemonset-promtail.yaml

# Deliberately excludes secret.example.yaml (documentation only) - the real
# `app-secrets` Secret is generated by k8s/deploy.sh from the developer's
# own .env at apply time, same as D43's "never committed" rule for
# docker-compose.yml's equivalent env vars.
#
# Every file: source below points into ./generated/, not ../../infra/ - both
# `kubectl apply -k` and `kubectl kustomize` refuse to reference a file
# outside the kustomization root as a security restriction (confirmed by
# running `kubectl kustomize k8s/base` in this sandbox: "file ... is not in
# or below" the kustomization dir). k8s/deploy.sh copies these in from
# infra/ (the actual committed source of truth) before every apply -
# generated/ itself is gitignored. See k8s/deploy.sh's "sync config
# sources" step.
configMapGenerator:
  - name: app-config
    envs:
      - config.env

  - name: cassandra-schema
    files:
      - generated/cassandra-schema/001_keyspace.cql
      - generated/cassandra-schema/002_raw_events.cql
      - generated/cassandra-schema/003_agg_1m.cql
      - generated/cassandra-schema/004_agg_1h.cql
      - generated/cassandra-schema/005_device_metadata.cql
      - generated/cassandra-schema/006_device_thresholds.cql
      - generated/cassandra-schema/007_raw_events_source_ts.cql

  - name: prometheus-config
    files:
      - prometheus.yml=generated/prometheus.yml

  - name: loki-config
    files:
      - loki-config.yml=generated/loki-config.yml

  - name: promtail-config
    files:
      # The Kubernetes-native variant (kubernetes_sd_configs, not
      # docker_sd_configs) - see infra/promtail/promtail-config-k8s.yml's
      # own header comment. promtail-config.yml (no -k8s suffix) stays as-is
      # for the historical docker-compose.yml deployment.
      - promtail-config.yml=generated/promtail-config-k8s.yml

  - name: grafana-provisioning-datasources
    files:
      - generated/grafana/datasources.yaml

  - name: grafana-provisioning-dashboards
    files:
      - generated/grafana/dashboards.yaml

  - name: grafana-dashboard-json
    files:
      - generated/grafana/kpi-dashboard.json

  - name: grafana-provisioning-alerting
    files:
      - generated/grafana/contactpoints.yaml
      - generated/grafana/policies.yaml
      - generated/grafana/rules.yaml

# ConfigMap content changes get a content-hash suffix and every Deployment
# referencing them is automatically bumped in the same `kubectl apply -k` -
# no manual pod restart/rollout needed after editing e.g. prometheus.yml.
generatorOptions:
  disableNameSuffixHash: false
