apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: iot-pipeline
  labels:
    app: spark-master
spec:
  selector:
    app: spark-master
  ports:
    - name: rpc
      port: 7077
      targetPort: 7077
    - name: ui
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: iot-pipeline
spec:
  replicas: 1
  # See deployment-spark-job.yaml: standalone Spark master isn't multi-master
  # aware (no ZK here), and the `spark-master` Service load-balances across
  # whichever pods are Ready, so two masters live at once during a rollout
  # could route workers/drivers inconsistently. Recreate avoids that overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      # Found live (D43): Kubernetes auto-injects a SPARK_MASTER_PORT env var
      # from the `spark-master` Service below (its port is named "rpc" but
      # Kubernetes' Service-links feature names the var after the Service,
      # not the port: SPARK_MASTER_PORT=tcp://<clusterIP>:7077). Spark's own
      # entrypoint reads SPARK_MASTER_PORT as a bare port number, so it
      # crashed with NumberFormatException on the "tcp://..." value. Disabled
      # cluster-wide (every pod spec in k8s/base) rather than just here, since
      # any other Service/app-env-var name pair could collide the same way.
      enableServiceLinks: false
      containers:
        - name: spark-master
          image: apache/spark:3.5.9
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
          env:
            # See deployment-spark-job.yaml for why this matters: makes
            # Spark advertise this pod's own IP instead of its (unresolvable
            # to other pods) bare hostname.
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # bin/spark-class defaults every Spark daemon class (Master,
            # Worker, ...) to a 1g heap via SPARK_DAEMON_MEMORY, regardless
            # of the container's own memory limit below - so shrinking the
            # limit without also capping this would self-OOM the JVM on
            # every single start. Same explicit-heap-paired-with-limit
            # pattern as statefulset-kafka.yaml's KAFKA_HEAP_OPTS and
            # statefulset-cassandra.yaml's MAX_HEAP_SIZE.
            - name: SPARK_DAEMON_MEMORY
              value: "384m"
          ports:
            - containerPort: 7077
              name: rpc
            - containerPort: 8080
              name: ui
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
