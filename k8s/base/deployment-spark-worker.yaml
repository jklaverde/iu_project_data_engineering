apiVersion: v1
kind: Service
metadata:
  name: spark-worker
  namespace: iot-pipeline
  labels:
    app: spark-worker
spec:
  # Found live (D43): backend/app/state_poller.py health-checks
  # http://spark-worker:8081/ directly (a Docker Compose container name is
  # always DNS-resolvable; a bare Kubernetes Deployment pod is not). This was
  # the one component missing its own Service, so the Pipeline Console's
  # deployment-status panel showed spark-worker as unreachable.
  selector:
    app: spark-worker
  ports:
    - name: ui
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: iot-pipeline
spec:
  replicas: 1
  # See deployment-spark-job.yaml: two workers briefly sharing this pod's
  # fixed memory limit during a rollout would halve the capacity available
  # to spark-job's executors right when a new driver is trying to register.
  # Recreate avoids that overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      # See deployment-spark-master.yaml for why this is set cluster-wide.
      enableServiceLinks: false
      # spark_job/worker.Dockerfile's base image runs as the "spark" user -
      # UID 185, per the original spark-job-volume-init chown target.
      securityContext:
        fsGroup: 185
      initContainers:
        - name: wait-for-spark-master
          image: busybox:1.36
          command: ["/bin/sh", "-c", "until nc -z spark-master 7077; do echo waiting for spark-master; sleep 2; done"]
      containers:
        - name: spark-worker
          image: iu-sensor-pipeline/spark-worker:local
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
          env:
            # See deployment-spark-job.yaml for why this matters: makes
            # Spark advertise this pod's own IP instead of its (unresolvable
            # to other pods) bare hostname.
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8081
              name: ui
          volumeMounts:
            - name: kaggle-dataset
              mountPath: /data
              readOnly: true
            - name: spark-checkpoints
              mountPath: /opt/spark-checkpoints
          readinessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: 1280Mi
            limits:
              memory: 2560Mi
      volumes:
        - name: kaggle-dataset
          persistentVolumeClaim:
            claimName: kaggle-dataset
        - name: spark-checkpoints
          persistentVolumeClaim:
            claimName: spark-checkpoints
