apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: iot-pipeline
  labels:
    app: kafka-exporter
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: iot-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      # See deployment-spark-master.yaml for why this is set cluster-wide.
      enableServiceLinks: false
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["/bin/sh", "-c", "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0
          env:
            - name: KAFKA_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_TOPIC_NAME
          args:
            - "--kafka.server=kafka:19092"
            - "--web.listen-address=:9308"
            - "--topic.filter=^$(KAFKA_TOPIC_NAME)$"
          ports:
            - containerPort: 9308
              name: metrics
          readinessProbe:
            httpGet: { path: /metrics, port: 9308 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /metrics, port: 9308 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
