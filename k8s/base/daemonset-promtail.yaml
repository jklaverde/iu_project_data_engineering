# promtail's kubernetes_sd_configs (infra/promtail/promtail-config-k8s.yml)
# needs to list/watch pods across the whole cluster to discover log targets
# - that's a different, unavoidably cluster-wide concern from the backend's
# namespaced Role (rbac.yaml), so it gets its own ServiceAccount/ClusterRole
# rather than widening the backend's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: iot-pipeline

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: iot-pipeline
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: iot-pipeline
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      # See deployment-spark-master.yaml for why this is set cluster-wide.
      enableServiceLinks: false
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.6.11
          args: ["-config.file=/etc/promtail/promtail-config.yml"]
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 96Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath: { path: /var/log/pods }
        - name: positions
          emptyDir: {}
