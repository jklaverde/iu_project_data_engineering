apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-schema-init
  namespace: iot-pipeline
spec:
  backoffLimit: 5
  template:
    spec:
      # See deployment-spark-master.yaml for why this is set cluster-wide.
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: cassandra-schema-init
          image: cassandra:4.1.12
          env:
            - name: CASSANDRA_HOST
              value: cassandra
            - name: CASSANDRA_PORT
              value: "9042"
          command: ["/bin/bash", "-c"]
          # Retries cqlsh itself (cassandra readiness, not just an open TCP
          # port) up to 30x/5s = 2.5min before the first schema file - same
          # script as docker-compose.yml's cassandra-schema-init, unchanged.
          args:
            - "for i in $(seq 1 30); do cqlsh $CASSANDRA_HOST $CASSANDRA_PORT -f /schema/001_keyspace.cql && break; echo 'cassandra not ready yet, retrying...'; sleep 5; done && cqlsh $CASSANDRA_HOST $CASSANDRA_PORT -f /schema/002_raw_events.cql && cqlsh $CASSANDRA_HOST $CASSANDRA_PORT -f /schema/003_agg_1m.cql && cqlsh $CASSANDRA_HOST $CASSANDRA_PORT -f /schema/004_agg_1h.cql && cqlsh $CASSANDRA_HOST $CASSANDRA_PORT -f /schema/005_device_metadata.cql && cqlsh $CASSANDRA_HOST $CASSANDRA_PORT -f /schema/006_device_thresholds.cql && cqlsh $CASSANDRA_HOST $CASSANDRA_PORT -f /schema/007_raw_events_source_ts.cql"
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 256Mi
      volumes:
        - name: schema
          configMap:
            name: cassandra-schema
