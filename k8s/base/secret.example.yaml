# NOT applied directly and NOT listed in kustomization.yaml's resources -
# this documents the Secret's expected shape only. The real `app-secrets`
# Secret is generated by k8s/deploy.sh (`up`, local and prod alike) from the
# operator's own .env (never committed). Only these keys come from .env on
# Kubernetes; every non-secret setting lives in k8s/base/config.env.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: iot-pipeline
type: Opaque
stringData:
  GRAFANA_ADMIN_PASSWORD: changeme
  BACKEND_ADMIN_PASSWORD: changeme
  BACKEND_PLANNER_PASSWORD: changeme
  BACKEND_SESSION_SECRET: changeme-generate-with-openssl-rand-hex-32
  KAGGLE_USERNAME: ""
  KAGGLE_KEY: ""
