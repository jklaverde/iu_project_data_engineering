apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: iot-pipeline
  labels:
    app: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: iot-pipeline
spec:
  # Scaled to 0 by default (11 GB production memory budget): kafka-ui is a
  # topic/message browsing convenience for debugging, not exposed to the
  # host, not referenced by any FR/UC or by the backend's own health grid -
  # zero standing memory cost this way. Scale up on demand when actually
  # debugging Kafka:
  #   kubectl -n iot-pipeline scale deploy/kafka-ui --replicas=1
  replicas: 0
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      # See deployment-spark-master.yaml for why this is set cluster-wide.
      enableServiceLinks: false
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["/bin/sh", "-c", "until nc -z kafka 19092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:19092
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
